name: Android CI - Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Restore Keystore & Configuration
        run: |
          # Ensure .env exists so secrets gradle plugin operates cleanly
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
              echo "Copied .env.example to .env"
            else
              touch .env
              echo "Created empty .env"
            fi
          fi

          # Restore debug.keystore from base64 if not present in workspace
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Restored debug.keystore from debug.keystore.base64"
          fi

      - name: Accept Android SDK Licenses
        run: |
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          elif [ -d "$ANDROID_HOME/tools/bin" ]; then
            yes | "$ANDROID_HOME/tools/bin/sdkmanager" --licenses || true
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Build Debug APK FIRST so the APK is guaranteed to be generated and saved
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MidnightBass-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      # Run Unit Tests (non-blocking for APK delivery)
      - name: Run Unit & Robolectric Tests
        run: ./gradlew testDebugUnitTest --continue
        continue-on-error: true

      # Build Release Bundle / APK (if keystore available in secrets)
      - name: Build Release Bundle / APK (if keystore available)
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "${{ runner.temp }}/upload.jks"
            export KEYSTORE_PATH="${{ runner.temp }}/upload.jks"
            export STORE_PASSWORD="${{ secrets.STORE_PASSWORD }}"
            export KEY_PASSWORD="${{ secrets.KEY_PASSWORD }}"
            ./gradlew assembleRelease
          else
            echo "No custom release keystore secret configured. Skipping signed release build."
          fi
        continue-on-error: true

      - name: Upload Release APK Artifact (if built)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MidnightBass-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
          if-no-files-found: ignore
